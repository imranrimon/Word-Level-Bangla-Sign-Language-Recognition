# Signer-independent benchmark sweep (Option A).
# Usage:
#   python tools/run_experiments.py --config experiments_si.yaml
# For multi-seed (3 seeds, mean +/- std reporting):
#   python tools/run_multiseed.py --config experiments_si.yaml --seeds 0 1 2
#
# All configs assume data/bdsl_si/ has been generated by
#   python preprocessing/generate_signer_split_npy.py \
#       --dataset-root "Word_level_Bangla_Sign_Language_Dataset/BdSLW30" \
#       --output-dir data/bdsl_si --cache-dir data/bdsl_cache

experiments:
  # Existing baselines (Option A)
  - name: "Pose-LSTM (SI)"
    config: "config/bdsl_pose_lstm_si.yaml"
    description: "Baseline Bi-LSTM on flattened pose sequences"

  - name: "ST-GCN Vanilla (SI)"
    config: "config/bdsl_st_gcn_vanilla_si.yaml"
    description: "Pure ST-GCN without attention or dilations"

  - name: "Attention GNN (SI)"
    config: "config/bdsl_gnn_si.yaml"
    description: "ST-GCN + Dilated TCN + Spatial/Temporal attention"

  - name: "Adaptive GNN (SI)"
    config: "config/bdsl_adaptive_gnn_si.yaml"
    description: "MS-TCN + stabilized adaptive graph (CTR-GCN style)"

  - name: "GNN + Bi-LSTM (SI)"
    config: "config/bdsl_gnn_lstm_si.yaml"
    description: "Spatial GCN + Bi-LSTM temporal modelling"

  - name: "GNN + Transformer (SI)"
    config: "config/bdsl_gnn_transformer_si.yaml"
    description: "Spatial GCN + Transformer encoder temporal modelling"

  - name: "SLGTFormer (SI)"
    config: "config/bdsl_slgtformer_si.yaml"
    description: "Full SLGTFormer (LGRPE + TTSA + PAF) baseline"

  # Option-C new models
  - name: "BlockGCN (SI)"
    config: "config/bdsl_block_gcn_si.yaml"
    description: "BlockGCN backbone with topological encoding (Option C, leg i)"

  - name: "BlockGCN + RQE (SI)"
    config: "config/bdsl_block_gcn_rqe_si.yaml"
    description: "BlockGCN + Relative Quantization Encoding (Option C, legs i+ii)"

  - name: "SLGTFormer + RQE (SI)"
    config: "config/bdsl_slgtformer_rqe_si.yaml"
    description: "SLGTFormer (twin_attention) with RQE injected as additive positional prior"

  # Option-B feature-isolation configs
  - name: "FlatTemporal (Pose, SI)"
    config: "config/bdsl_pose_temporal_si.yaml"
    description: "Temporal transformer over flattened 27-keypoint pose (baseline for Option B)"

  - name: "FlatTemporal (DINOv2, SI)"
    config: "config/bdsl_dino_temporal_si.yaml"
    description: "Same transformer, DINOv2 hand/face features instead of pose (Option B)"
