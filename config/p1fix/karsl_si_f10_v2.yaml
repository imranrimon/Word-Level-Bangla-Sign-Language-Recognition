# P1 fix 2026-10 (v2 law rerun): IDENTICAL recipe to config/karsl_si_lr01_f10.yaml
# EXCEPT the data: data/karsl_si_v2a = train U01+U02 (all clips), val = held-out signer U03
# (the original data/karsl_si val was a random 12% of the TRAINING signers -> signer-dependent).
# Only addition: results go to results_p1fix_v2.csv (not results_final.csv).
# P1 item6 (2026-10-10): law fine-tune recipe materialised for pretraining-seed replication.
# Identical to config/karsl_si_lr01.yaml + --train-fraction 0.1 (subset_seed 42, the default) + explicit
# grad_clip_norm 0.0 (no clipping, as the original *_lr01_f10_{pool,xling} runs).
# Backbone weights are passed per run via tools/run_resumable_seed.py --init-weights (fc dropped).
Experiment_name: karsl_si_lr01

# Signer-independent BdSLW60 split. Generated by:
#   python preprocessing/generate_signer_split_npy.py \
#       --dataset-root "Word_level_Bangla_Sign_Language_Dataset/BdSLW30" \
#       --output-dir data/bdsl_si --cache-dir data/bdsl_cache \
#       --splits train val test
# Signers: train=U01,U04,U05,U06,U08,U09,U11,U12 / val=U15 / test=U02,U13.
# Clips:   train=5748 / val=655 / test=1365 (total 9307 with pretrain pool).

# feeder
feeder: feeders.feeder.Feeder
train_feeder_args:
  data_path: data/karsl_si_v2a/train_data.npy
  label_path: data/karsl_si_v2a/train_label.pkl
  debug: False
  random_choose: True
  window_size: 120
  random_shift: True
  normalization: True
  random_mirror: False       # off: BdSL hand-dominance is class-informative
  random_mirror_p: 0.0
  is_vector: False
  lap_pe: False

test_feeder_args:
  data_path: data/karsl_si_v2a/val_data.npy
  label_path: data/karsl_si_v2a/val_label.pkl
  random_mirror: False
  normalization: True
  is_vector: False
  lap_pe: False
  window_size: 120
  random_choose: False

# model
model: model.block_gcn.Model
model_args:
  num_class: 70
  num_point: 27
  num_person: 1
  graph: graph.sign_27.Graph
  graph_args:
    labeling_mode: 'spatial'
  in_channels: 3
  num_blocks: [2, 2, 2, 2]
  stage_channels: [64, 128, 256, 256]
  max_distance: 8

# optim
weight_decay: 0.0001
base_lr: 0.01
step: [60, 80]

# training
device: [0]
keep_rate: 0.9
only_train_epoch: 1
batch_size: 32
test_batch_size: 32
num_epoch: 100
nesterov: True
warm_up_epoch: 5
optimizer: SGD

wandb: False
num_worker: 0
save_interval: 10

# P1 law @10% recipe
train_fraction: 0.1
subset_seed: 42
grad_clip_norm: 0.0

results_csv: results_p1fix_v2.csv
