# P1 fix 2026-10 (v2 law rerun): IDENTICAL recipe to config/bisindo_si_lr01.yaml + the P1 law @10% recipe (train_fraction 0.1, subset_seed 42, grad_clip_norm 0.0, num_worker 8 =
# exactly the original bisindo_si_lr01_f10_{pool,xling} runs' saved config.yaml)
# TEST-phase config (held-out test signers). Only addition: results go to results_p1fix_v2.csv (not results_final.csv).
Experiment_name: bisindo_si

# Signer-independent WL-BISINDO (Indonesian Sign Language, Banten variant) split.
# 6th cross-lingual TARGET language for the distance-gating law (P1).
# Generated by:
#   python preprocessing/generate_bisindo_split_npy.py \
#       --dataset-root data/bisindo_raw --output-dir data/bisindo_si \
#       --cache-dir data/bisindo_cache --split-json splits/bisindo_signer_independent.json \
#       --splits train val test --jobs 16
# Signers: train=1,2 / val=3 / test=4 (signer-disjoint; partial signer 0 excluded).
# 32 signs, 1600 clips total. Fine-tune recipe mirrors lsa64_si_lr01 exactly.

# feeder
feeder: feeders.feeder.Feeder
train_feeder_args:
  data_path: data/bisindo_si/train_data.npy
  label_path: data/bisindo_si/train_label.pkl
  debug: False
  random_choose: True
  window_size: 120
  random_shift: True
  normalization: True
  random_mirror: False       # off: signer hand-dominance is class-informative
  random_mirror_p: 0.0
  is_vector: False
  lap_pe: False

test_feeder_args:
  data_path: data/bisindo_si/test_data.npy     # val for in-training selection; test_data.npy held out for --phase test
  label_path: data/bisindo_si/test_label.pkl
  random_mirror: False
  normalization: True
  is_vector: False
  lap_pe: False
  window_size: 120
  random_choose: False

# model
model: model.block_gcn.Model
model_args:
  num_class: 32
  num_point: 27
  num_person: 1
  graph: graph.sign_27.Graph
  graph_args:
    labeling_mode: 'spatial'
  in_channels: 3
  num_blocks: [2, 2, 2, 2]
  stage_channels: [64, 128, 256, 256]
  max_distance: 8

# optim
weight_decay: 0.0001
base_lr: 0.01
step: [60, 80]

# training
device: [0]
keep_rate: 0.9
only_train_epoch: 1
batch_size: 32
test_batch_size: 32
num_epoch: 100
nesterov: True
warm_up_epoch: 5
optimizer: SGD

wandb: False
num_worker: 8
save_interval: 10

# P1 law @10% recipe
train_fraction: 0.1
subset_seed: 42
grad_clip_norm: 0.0

results_csv: results_p1fix_v2.csv
