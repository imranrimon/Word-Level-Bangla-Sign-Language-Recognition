Experiment_name: bdsl_shubert_pretrain_bdsl_only

# Variant A — in-language SSL pretraining (BdSLW401 + BdSLW102_A only, 54,506 clips).
# Paired with bdsl_shubert_pretrain_bdsl_asl.yaml (Variant B = adds WLASL) for
# the cross-lingual-SSL ablation in T5 of the main paper.
#
# Both variants use: stride_between_stages=False (SSL requires T_out == T_in),
# pose_motion clustering (audit fix #1), --per-source-cap 200000 balanced k-means
# (audit fix #12).

backbone: model.block_gcn.Model
backbone_args:
  num_class: 60
  num_point: 27
  num_person: 1
  graph: graph.sign_27.Graph
  graph_args:
    labeling_mode: 'spatial'
  in_channels: 3
  num_blocks: [2, 2, 2, 2]
  stage_channels: [64, 128, 256, 256]
  max_distance: 8
  return_features: True
  stride_between_stages: False

pretrain:
  manifest: data/ssl_pool_manifest_bdsl_only.json
  targets:  data/pretrain_kmeans_targets_bdsl_only.npz
  num_codes: 64
  mask_ratio: 0.3
  window_size: 120
  feat_dim: 256

base_lr: 0.0001
weight_decay: 0.0001

batch_size: 32
num_epoch: 30
save_interval: 5
num_worker: 0
log_every: 50
