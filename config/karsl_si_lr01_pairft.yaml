Experiment_name: karsl_si_lr01_pairft

# P1 pairwise transfer matrix: TARGET-side classifier for KARSL @ base_lr 0.01.
# Reused for every source backbone -> KARSL finetune (Experiment_name and
# --weights/--train-fraction are overridden on the CLI by the sbatch). Byte-mirrors
# the committed karsl_si_lr01.yaml recipe (BlockGCN, SGD, 100 ep, val Top-1 selection).

# feeder
feeder: feeders.feeder.Feeder
train_feeder_args:
  data_path: data/karsl_si/train_data.npy
  label_path: data/karsl_si/train_label.pkl
  debug: False
  random_choose: True
  window_size: 120
  random_shift: True
  normalization: True
  random_mirror: False
  random_mirror_p: 0.0
  is_vector: False
  lap_pe: False

test_feeder_args:
  data_path: data/karsl_si/val_data.npy
  label_path: data/karsl_si/val_label.pkl
  random_mirror: False
  normalization: True
  is_vector: False
  lap_pe: False
  window_size: 120
  random_choose: False

# model
model: model.block_gcn.Model
model_args:
  num_class: 70
  num_point: 27
  num_person: 1
  graph: graph.sign_27.Graph
  graph_args:
    labeling_mode: 'spatial'
  in_channels: 3
  num_blocks: [2, 2, 2, 2]
  stage_channels: [64, 128, 256, 256]
  max_distance: 8

# optim
weight_decay: 0.0001
base_lr: 0.01
step: [60, 80]

# training
device: [0]
keep_rate: 0.9
only_train_epoch: 1
batch_size: 32
test_batch_size: 32
num_epoch: 100
nesterov: True
warm_up_epoch: 5
optimizer: SGD

wandb: False
num_worker: 0
save_interval: 10
