# P1 item6 (2026-10-10): law fine-tune recipe materialised for pretraining-seed replication.
# Identical to config/libras_si_lr01.yaml + --train-fraction 0.1 (subset_seed 42, the default) + explicit
# grad_clip_norm 0.0 (no clipping, as the original *_lr01_f10_{pool,xling} runs) + num_worker 8
# (the originals were launched with --num-worker 8).
# Backbone weights are passed per run via tools/run_resumable_seed.py --init-weights (fc dropped).
Experiment_name: libras_si_lr01

# Signer-independent MINDS-Libras (Brazilian Sign Language, isolated) split.
# 6th cross-lingual TARGET language for the distance-gating law (P1), replacing
# INCLUDE-50 (dropped: random official split, no recoverable signer labels).
# Generated by:
#   python preprocessing/generate_libras_split_npy.py \
#       --dataset-root data/libras_download \
#       --output-dir   data/libras_si --cache-dir data/libras_cache \
#       --split-json   splits/libras_signer_independent.json \
#       --splits train val test --jobs 8
# Signer-disjoint (Zenodo record 2667329 = one zip per signer, Sinalizador01..12):
#   train=signers 1-8 / val=9-10 / test=11-12.
# 20 glosses, 12 signers. Fine-tune recipe mirrors karsl_si_lr01 / gsl_si_lr01.

# feeder
feeder: feeders.feeder.Feeder
train_feeder_args:
  data_path: data/libras_si/train_data.npy
  label_path: data/libras_si/train_label.pkl
  debug: False
  random_choose: True
  window_size: 120
  random_shift: True
  normalization: True
  random_mirror: False
  random_mirror_p: 0.0
  is_vector: False
  lap_pe: False

test_feeder_args:
  data_path: data/libras_si/val_data.npy
  label_path: data/libras_si/val_label.pkl
  random_mirror: False
  normalization: True
  is_vector: False
  lap_pe: False
  window_size: 120
  random_choose: False

# model
model: model.block_gcn.Model
model_args:
  num_class: 20
  num_point: 27
  num_person: 1
  graph: graph.sign_27.Graph
  graph_args:
    labeling_mode: 'spatial'
  in_channels: 3
  num_blocks: [2, 2, 2, 2]
  stage_channels: [64, 128, 256, 256]
  max_distance: 8

# optim
weight_decay: 0.0001
base_lr: 0.01
step: [60, 80]

# training
device: [0]
keep_rate: 0.9
only_train_epoch: 1
batch_size: 32
test_batch_size: 32
num_epoch: 100
nesterov: True
warm_up_epoch: 5
optimizer: SGD

wandb: False
num_worker: 8
save_interval: 10

# P1 law @10% recipe
train_fraction: 0.1
subset_seed: 42
grad_clip_norm: 0.0
