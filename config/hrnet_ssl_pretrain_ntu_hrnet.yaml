Experiment_name: hrnet_ssl_pretrain_ntu_hrnet
# P1 cross-domain generality: masked-pose SSL on HRNet source domain 'ntu_hrnet'
# (BlockGCN, COCO-17 graph V=17, stride_between_stages=False). Lab-vs-wild demo.
backbone: model.block_gcn.Model
backbone_args:
  num_class: 60
  num_point: 17
  num_person: 1
  graph: graph.sign_27.Graph
  graph_args:
    labeling_mode: 'spatial'
    graph: 'coco17'
  in_channels: 3
  num_blocks: [2, 2, 2, 2]
  stage_channels: [64, 128, 256, 256]
  max_distance: 8
  return_features: True
  stride_between_stages: False
pretrain:
  manifest: data/ssl_pool_manifest_hrnet_ntu_hrnet.json
  targets:  data/pretrain_kmeans_targets_hrnet_ntu_hrnet.npz
  num_codes: 64
  mask_ratio: 0.3
  window_size: 120
  feat_dim: 256
base_lr: 0.0001
weight_decay: 0.0001
batch_size: 32
num_epoch: 30
save_interval: 5
num_worker: 0
log_every: 50
