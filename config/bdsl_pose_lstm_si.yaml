Experiment_name: bdsl_pose_lstm_si

# Signer-independent variant of config/bdsl_pose_lstm.yaml.
# Data: data/bdsl_si/ (produced by preprocessing/generate_signer_split_npy.py).

feeder: feeders.feeder.Feeder
train_feeder_args:
  data_path: ./data/bdsl_si/train_data.npy
  label_path: ./data/bdsl_si/train_label.pkl
  debug: False
  random_choose: True
  random_shift: True
  random_move: False
  window_size: 120
  normalization: True
  random_mirror: False        # off: BdSL hand-dominance is class-informative
  random_mirror_p: 0.0
  is_vector: False
  lap_pe: False

test_feeder_args:
  data_path: ./data/bdsl_si/val_data.npy
  label_path: ./data/bdsl_si/val_label.pkl
  window_size: 120
  random_choose: False
  normalization: True

model: model.pose_lstm.Model
model_args:
  num_class: 60
  num_point: 27
  num_person: 1
  in_channels: 3

weight_decay: 0.0001
base_lr: 0.01
step: [60, 80]

device: [0]
batch_size: 16
test_batch_size: 16
num_epoch: 100
nesterov: True
warm_up_epoch: 5

wandb: False
num_worker: 0
