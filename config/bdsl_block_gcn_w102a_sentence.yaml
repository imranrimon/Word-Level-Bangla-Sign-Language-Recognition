Experiment_name: bdsl_block_gcn_w102a_sentence

# BlockGCN trained on BdSLW102_A SENTENCE-level data (19 sentence classes).
# Generated by:
#   python preprocessing/bundle_bdslw102a_sentence_pose_to_npy.py \
#       --cache-dir data/bdslw102_a_pose_cache/Sentence \
#       --output-dir data/bdslw102a_sentence \
#       --variant-filter withBg --seed 0
# Splits (random 70/15/15, seed 0):
#   train: 947 clips
#   val:   202 clips
#   test:  202 clips
# 19 sentence classes (sentence ID 13 missing from disk; documented in
# Paper 3's §6 limitations).
#
# Scratch baseline: invoke with `python main.py --config <this>` as-is.
# BPT variant: invoke with `--weights work_dir/bdsl_block_gcn_w401_seed0/best.pt
# --ignore-weights fc.weight fc.bias --base-lr 0.01` (Paper 3 §4.2).

# feeder
feeder: feeders.feeder.Feeder
train_feeder_args:
  data_path: data/bdslw102a_sentence/train_data.npy
  label_path: data/bdslw102a_sentence/train_label.pkl
  debug: False
  random_choose: True
  window_size: 120
  random_shift: True
  normalization: True
  random_mirror: False
  random_mirror_p: 0.0
  is_vector: False
  lap_pe: False

test_feeder_args:
  data_path: data/bdslw102a_sentence/val_data.npy
  label_path: data/bdslw102a_sentence/val_label.pkl
  random_mirror: False
  normalization: True
  is_vector: False
  lap_pe: False
  window_size: 120
  random_choose: False

# model
model: model.block_gcn.Model
model_args:
  num_class: 19
  num_point: 27
  num_person: 1
  graph: graph.sign_27.Graph
  graph_args:
    labeling_mode: 'spatial'
  in_channels: 3
  num_blocks: [2, 2, 2, 2]
  stage_channels: [64, 128, 256, 256]
  max_distance: 8

# optim
weight_decay: 0.0001
base_lr: 0.1
step: [25, 35]

# training
device: [0]
keep_rate: 0.9
only_train_epoch: 1
batch_size: 32
test_batch_size: 32
num_epoch: 40
nesterov: True
warm_up_epoch: 5
optimizer: SGD

wandb: False
num_worker: 0
save_interval: 10
