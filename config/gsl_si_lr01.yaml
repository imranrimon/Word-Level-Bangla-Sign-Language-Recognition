Experiment_name: gsl_si_lr01

# Signer-independent GSL isol. (Greek Sign Language, isolated) split.
# 6th cross-lingual TARGET language for the distance-gating law (P1).
# Generated by:
#   python preprocessing/generate_gsl_split_npy.py \
#       --iso-root data/gsl_download/GSL_isolated \
#       --csv-dir  data/gsl_download/_split/GSL_split/GSL_isolated \
#       --iso-classes data/gsl_download/_split/GSL_split/GSL_isolated/iso_classes.csv \
#       --output-dir data/gsl_si --cache-dir data/gsl_cache --jobs 8
# Signer-disjoint (own split, NOT the official iso split):
#   train=signers 1-5 / val=signer 6 / test=signer 7.
# 310 glosses, 7 signers. Fine-tune recipe mirrors karsl_si_lr01 exactly.

# feeder
feeder: feeders.feeder.Feeder
train_feeder_args:
  data_path: data/gsl_si/train_data.npy
  label_path: data/gsl_si/train_label.pkl
  debug: False
  random_choose: True
  window_size: 120
  random_shift: True
  normalization: True
  random_mirror: False
  random_mirror_p: 0.0
  is_vector: False
  lap_pe: False

test_feeder_args:
  data_path: data/gsl_si/val_data.npy
  label_path: data/gsl_si/val_label.pkl
  random_mirror: False
  normalization: True
  is_vector: False
  lap_pe: False
  window_size: 120
  random_choose: False

# model
model: model.block_gcn.Model
model_args:
  num_class: 310
  num_point: 27
  num_person: 1
  graph: graph.sign_27.Graph
  graph_args:
    labeling_mode: 'spatial'
  in_channels: 3
  num_blocks: [2, 2, 2, 2]
  stage_channels: [64, 128, 256, 256]
  max_distance: 8

# optim
weight_decay: 0.0001
base_lr: 0.01
step: [60, 80]

# training
device: [0]
keep_rate: 0.9
only_train_epoch: 1
batch_size: 32
test_batch_size: 32
num_epoch: 100
nesterov: True
warm_up_epoch: 5
optimizer: SGD

wandb: False
num_worker: 0
save_interval: 10
