Experiment_name: bdsl_st_gcn_w401

# ST-GCN trained on BdSLW401 — Paper 2 architecture #1 (2018 baseline).
# Companion to bdsl_block_gcn_w401.yaml (Paper 2's BlockGCN headline).

feeder: feeders.feeder.Feeder
train_feeder_args:
  data_path: data/bdslw401_si/train_data.npy
  label_path: data/bdslw401_si/train_label.pkl
  debug: False
  random_choose: True
  window_size: 120
  random_shift: True
  normalization: True
  random_mirror: False
  random_mirror_p: 0.0
  is_vector: False
  lap_pe: False

test_feeder_args:
  data_path: data/bdslw401_si/val_data.npy
  label_path: data/bdslw401_si/val_label.pkl
  random_mirror: False
  normalization: True
  is_vector: False
  lap_pe: False
  window_size: 120
  random_choose: False

model: model.st_gcn_vanilla.Model
model_args:
  num_class: 401
  num_point: 27
  num_person: 1
  graph: graph.sign_27.Graph
  graph_args:
    labeling_mode: 'spatial'
  in_channels: 3

weight_decay: 0.0001
base_lr: 0.1
step: [60, 80]
device: [0]
keep_rate: 0.9
only_train_epoch: 1
batch_size: 32
test_batch_size: 32
num_epoch: 100
nesterov: True
warm_up_epoch: 5
optimizer: SGD
wandb: False
num_worker: 0
save_interval: 10
