Experiment_name: bdsl_block_gcn_w401

# BlockGCN trained on BdSLW401 (401 words, author splits).
# Generated by:
#   python preprocessing/bundle_bdslw401_pose_to_npy.py \
#       --cache-dir data/bdslw401_pose_cache_front \
#       --output-dir data/bdslw401_si
# Splits (author-defined):
#   train: 38,876 clips
#   val:    4,389 clips
#   test:   7,833 clips
# Total 51,098 clips across 401 word classes.
#
# This config produces the BdSLW401-trained backbone used as the
# pretrain source in Paper 2 (BPT recipe) and Paper 3 (word->sentence
# transfer). Save best.pt; it is reused downstream.

# feeder
feeder: feeders.feeder.Feeder
train_feeder_args:
  data_path: data/bdslw401_si/train_data.npy
  label_path: data/bdslw401_si/train_label.pkl
  debug: False
  random_choose: True
  window_size: 120
  random_shift: True
  normalization: True
  random_mirror: False
  random_mirror_p: 0.0
  is_vector: False
  lap_pe: False

test_feeder_args:
  data_path: data/bdslw401_si/val_data.npy
  label_path: data/bdslw401_si/val_label.pkl
  random_mirror: False
  normalization: True
  is_vector: False
  lap_pe: False
  window_size: 120
  random_choose: False

# model
model: model.block_gcn.Model
model_args:
  num_class: 401
  num_point: 27
  num_person: 1
  graph: graph.sign_27.Graph
  graph_args:
    labeling_mode: 'spatial'
  in_channels: 3
  num_blocks: [2, 2, 2, 2]
  stage_channels: [64, 128, 256, 256]
  max_distance: 8

# optim
weight_decay: 0.0001
base_lr: 0.1
step: [60, 80]

# training
device: [0]
keep_rate: 0.9
only_train_epoch: 1
batch_size: 32
test_batch_size: 32
num_epoch: 100
nesterov: True
warm_up_epoch: 5
optimizer: SGD

wandb: False
num_worker: 0
save_interval: 10
