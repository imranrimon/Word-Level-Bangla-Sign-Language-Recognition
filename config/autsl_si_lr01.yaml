Experiment_name: autsl_si

# AUTSL (Turkish SL), OFFICIAL signer-disjoint split (train 31 / val 6 / test 6 signers).
#   python preprocessing/generate_lsa64_split_npy.py \
#       --dataset-root data/lsa64_raw --output-dir data/autsl_si \
#       --cache-dir data/lsa64_cache --split-json splits/lsa64_signer_independent.json \
#       --splits train val test --jobs 16
# Signers: train=1-7 / val=8 / test=9-10 (signer-disjoint).
# Clips:   train=2240 / val=320 / test=640 (64 signs x 10 signers x 5 reps = 3200).
# 27-keypoint MediaPipe skeleton, same as BdSLW60 (cross-lingual transfer target, plan R9).

# feeder
feeder: feeders.feeder.Feeder
train_feeder_args:
  data_path: data/autsl_si/train_data.npy
  label_path: data/autsl_si/train_label.pkl
  debug: False
  random_choose: True
  window_size: 120
  random_shift: True
  normalization: True
  random_mirror: False       # off: signer hand-dominance is class-informative
  random_mirror_p: 0.0
  is_vector: False
  lap_pe: False

test_feeder_args:
  data_path: data/autsl_si/val_data.npy     # val for in-training selection; test_data.npy is held out for --phase test
  label_path: data/autsl_si/val_label.pkl
  random_mirror: False
  normalization: True
  is_vector: False
  lap_pe: False
  window_size: 120
  random_choose: False

# model
model: model.block_gcn.Model
model_args:
  num_class: 226
  num_point: 27
  num_person: 1
  graph: graph.sign_27.Graph
  graph_args:
    labeling_mode: 'spatial'
  in_channels: 3
  num_blocks: [2, 2, 2, 2]
  stage_channels: [64, 128, 256, 256]
  max_distance: 8

# optim
weight_decay: 0.0001
base_lr: 0.01
step: [60, 80]

# training
device: [0]
keep_rate: 0.9
only_train_epoch: 1
batch_size: 32
test_batch_size: 32
num_epoch: 100
nesterov: True
warm_up_epoch: 5
optimizer: SGD

wandb: False
num_worker: 0
save_interval: 10
