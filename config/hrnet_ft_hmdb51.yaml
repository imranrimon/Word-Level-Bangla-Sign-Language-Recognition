Experiment_name: hrnet_ft_hmdb51
# P1 cross-domain: finetune on target domain 'hmdb51' (COCO-17, V=17). Use with
# --train-fraction 0.1 and --weights <backbone>/pretrained_epoch30.pt (SSL) or none (scratch).
feeder: feeders.feeder.Feeder
train_feeder_args:
  data_path: data/hrnet_hmdb51/train_data.npy
  label_path: data/hrnet_hmdb51/train_label.pkl
  debug: False
  random_choose: True
  window_size: 120
  random_shift: True
  normalization: True
  random_mirror: False
  is_vector: False
  lap_pe: False
test_feeder_args:
  data_path: data/hrnet_hmdb51/val_data.npy
  label_path: data/hrnet_hmdb51/val_label.pkl
  random_mirror: False
  normalization: True
  is_vector: False
  window_size: 120
  random_choose: False
model: model.block_gcn.Model
model_args:
  num_class: 51
  num_point: 17
  num_person: 1
  graph: graph.sign_27.Graph
  graph_args:
    labeling_mode: 'spatial'
    graph: 'coco17'
  in_channels: 3
  num_blocks: [2, 2, 2, 2]
  stage_channels: [64, 128, 256, 256]
  max_distance: 8
weight_decay: 0.0001
base_lr: 0.01
step: [60, 80]
device: [0]
keep_rate: 0.9
only_train_epoch: 1
batch_size: 32
test_batch_size: 32
num_epoch: 100
nesterov: True
warm_up_epoch: 5
optimizer: SGD
wandb: False
num_worker: 0
save_interval: 50
