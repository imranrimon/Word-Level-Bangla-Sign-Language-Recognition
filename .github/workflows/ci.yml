name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - run: python -m pip install "ruff==0.6.9"
      - run: ruff check .

  test:
    runs-on: ubuntu-22.04
    env:
      CUDA_VISIBLE_DEVICES: ""
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.4.1 torchvision==0.19.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: python -m pip install -r requirements.txt "pytest>=7"
      - name: Unit and smoke tests (no data)
        run: python -m pytest
      - name: Paper numbers reproduce from the archived results (no data)
        run: python tools/reproduce.py
