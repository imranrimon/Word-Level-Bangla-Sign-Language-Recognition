Experiment_name: rgb_i3d_bdsl_si

# Exact ASL-Citizen-parity RGB row: Kinetics-400 I3D (piergiaj weights).
# Requires the checkpoint to be downloaded manually first:
#   curl.exe -L -o path4_rgb_baseline/weights/rgb_imagenet.pt \
#     https://github.com/piergiaj/pytorch-i3d/raw/master/models/rgb_imagenet.pt
# Run:
#   python -m path4_rgb_baseline.train_rgb --config path4_rgb_baseline/configs/i3d_bdsl_si.yaml --seed 0

model_name: i3d
pretrained: True
i3d_weights: path4_rgb_baseline/weights/rgb_imagenet.pt
num_class: 60

dataset_root: Word_level_Bangla_Sign_Language_Dataset/BdSLW30
classes_json: data/bdsl_si/classes.json
num_frames: 32
frame_size: 224
resize_short: 256

batch_size: 8
test_batch_size: 8
base_lr: 0.01
weight_decay: 0.0000001
step: [15, 25]
num_epoch: 30
warm_up_epoch: 2
nesterov: True
amp: True

device: [0]
seed: 0
num_worker: 0
results_csv: results_final.csv
